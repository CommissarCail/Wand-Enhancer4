name: Build executable

on:
  workflow_dispatch:
    inputs:
      enable_update_notifications:
        description: Include GitHub release checks when Wand starts
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WandEnhancer (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # Fail early with a useful message if the repository contains only
      # documentation or is missing one of the documented build inputs.
      - name: Verify project source files
        shell: pwsh
        run: |
          $required = @(
            'Wand-Enhancer.sln',
            'build.ps1',
            'build.cmd',
            'WandEnhancer',
            'web-panel/package.json',
            'web-panel/pnpm-lock.yaml'
          )

          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            Write-Host 'The checkout is missing required Wand Enhancer build files:' -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
            Write-Host ''
            Write-Host 'The repository must contain the complete source tree at its root.'
            Write-Host 'A README-only repository cannot produce WandEnhancer.exe.'
            exit 1
          }

      # The project build script resolves Visual Studio/MSBuild itself;
      # this action also exposes MSBuild on PATH for child build tools.
      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Deliberately no dependency cache: previous workflows failed
          # because GitHub could not resolve the cache-dependency path.

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          pnpm --version
          msbuild -version
          cmake --version

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio installer locator was not found: $vswhere"
          }

          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw 'Visual Studio 2022 with MSBuild was not found on the runner.'
          }
          Write-Host "Visual Studio: $vsPath"

      - name: Build and test Wand Enhancer
        shell: pwsh
        env:
          ENABLE_UPDATE_NOTIFICATIONS: ${{ inputs.enable_update_notifications }}
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('-Configuration', 'Release')
          if ($env:ENABLE_UPDATE_NOTIFICATIONS -eq 'true') {
            $arguments += '-EnableUpdateNotifications'
          }

          & ./build.ps1 @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "build.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Verify executable output
        shell: pwsh
        run: |
          $exe = 'WandEnhancer/bin/Release/WandEnhancer.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Build completed without producing the expected executable: $exe"
          }
          Get-Item -LiteralPath $exe | Format-List FullName, Length, LastWriteTime

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v6
        with:
          name: WandEnhancer-unsigned-${{ github.sha }}
          path: WandEnhancer/bin/Release/WandEnhancer.exe
          if-no-files-found: error
          retention-days: 14

